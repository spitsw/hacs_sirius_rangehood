[project]
name = "sirius-rangehood"
version = "1.1.0"
description = "Home Assistant integration for WiFi-enabled Sirius rangehoods"
requires-python = ">=3.14"

[tool.semantic_release]
# manifest.json is what HACS/hassfest read, so keep it in lockstep with the
# pyproject version. The manifest entry is matched as the JSON key "version".
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    'custom_components/sirius_rangehood_custom/manifest.json:"version"',
]
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "(main|master)"

[tool.semantic_release.changelog]
mode = "init"
