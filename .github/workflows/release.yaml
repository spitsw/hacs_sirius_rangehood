name: Release

on:
  push:
    branches:
      - "main"

permissions:
  contents: write

jobs:
  release:
    name: "Semantic release"
    runs-on: "ubuntu-latest"
    concurrency:
      group: "semantic-release"
      cancel-in-progress: false
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install python-semantic-release
        run: python3 -m pip install python-semantic-release==10.7.0

      - name: Create the release
        # Derives the next SemVer from Conventional Commit messages, bumps the
        # version in pyproject.toml and manifest.json, commits, tags vX.Y.Z and
        # creates the GitHub Release.
        #
        # `main` is protected (changes go through a PR), so
        # python-semantic-release cannot push its version-bump commit with the
        # default GITHUB_TOKEN. Supply a PAT or GitHub App token as the
        # RELEASE_TOKEN secret and add it as a branch-protection bypass actor.
        # (Alternatively keep ${{ secrets.GITHUB_TOKEN }} and add the Actions
        # bot to the bypass list.)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: semantic-release -v version
